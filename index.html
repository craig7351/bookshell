<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOKSHELL</title>
    <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html, body, #root {
        height: 100%; margin: 0;
        background: #1c1c1e;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
      button { font-family: inherit; }
      input, textarea, select { font-family: inherit; }

      /* ── Markdown viewer ──────────────────────────── */
      .md-viewer {
        color: #e0e0e0;
        font-size: 14px;
        line-height: 1.7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .md-viewer h1, .md-viewer h2, .md-viewer h3,
      .md-viewer h4, .md-viewer h5, .md-viewer h6 {
        margin: 1.2em 0 0.4em;
        font-weight: 600;
        line-height: 1.3;
        color: #f2f2f7;
      }
      .md-viewer h1 { font-size: 1.7em; border-bottom: 1px solid #3a3a3c; padding-bottom: 0.3em; }
      .md-viewer h2 { font-size: 1.35em; border-bottom: 1px solid #3a3a3c; padding-bottom: 0.2em; }
      .md-viewer h3 { font-size: 1.1em; }
      .md-viewer p { margin: 0.7em 0; }
      .md-viewer a { color: #0a84ff; text-decoration: none; }
      .md-viewer a:hover { text-decoration: underline; }
      .md-viewer code {
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        border-radius: 4px;
        padding: 0.15em 0.4em;
        font-size: 0.88em;
        font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", monospace;
      }
      .md-viewer pre {
        background: #1e1e20;
        border: 1px solid #3a3a3c;
        border-radius: 8px;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 1em 0;
      }
      .md-viewer pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 0.85em;
        color: #e0e0e0;
      }
      .md-viewer blockquote {
        border-left: 3px solid #48484a;
        margin: 0.8em 0;
        padding: 0.2em 1em;
        color: #98989d;
      }
      .md-viewer ul, .md-viewer ol { padding-left: 1.6em; margin: 0.5em 0; }
      .md-viewer li { margin: 0.25em 0; }
      .md-viewer table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 13px; }
      .md-viewer th, .md-viewer td { border: 1px solid #3a3a3c; padding: 6px 12px; text-align: left; }
      .md-viewer th { background: #2c2c2e; font-weight: 600; }
      .md-viewer tr:nth-child(even) { background: rgba(255,255,255,0.03); }
      .md-viewer img { max-width: 100%; border-radius: 6px; }
      .md-viewer hr { border: none; border-top: 1px solid #3a3a3c; margin: 1.5em 0; }
      .md-viewer .mermaid-pending svg,
      .md-viewer svg[id^="mermaid-"] {
        max-width: 100%;
        background: #1c1c1e;
        border-radius: 8px;
        padding: 12px;
        margin: 0.8em 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
