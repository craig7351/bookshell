<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOKSHELL</title>
    <link rel="stylesheet" href="/node_modules/highlight.js/styles/github-dark.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <style>
      /* Critical block only: everything that must be right on the very first
         paint. Design tokens live in src/styles/tokens.css, all interaction
         state and scrollbars in src/styles/base.css, and xterm.css is imported
         from src/main.tsx. */
      html, body, #root {
        height: 100%; margin: 0;
        background: #1c1c1e;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      button { font-family: inherit; }
      input, textarea, select { font-family: inherit; }

      /* Markdown viewer (.md-viewer) styles are injected at runtime from the
         shared design tokens — see src/components/MarkdownViewer.tsx. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
