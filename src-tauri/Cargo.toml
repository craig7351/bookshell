[package]
name = "bookshell"
version = "0.0.1"
description = "BOOKSHELL — SSH terminal for AI agents"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bookshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.46"
russh-keys = "0.46"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = "0.8"
notify = "6"
rfd = "0.15"

[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
