name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          node -e "
            const fs=require('fs');
            for (const f of ['package.json','src-tauri/tauri.conf.json']) {
              const j=JSON.parse(fs.readFileSync(f,'utf8'));
              j.version='$VERSION';
              fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');
            }
          "
          # Update Cargo.toml [package] version (first occurrence only)
          python -c "
          import re,sys
          p='src-tauri/Cargo.toml'
          t=open(p,encoding='utf-8').read()
          t=re.sub(r'(?m)^(version\s*=\s*)\"[^\"]+\"', r'\1\"$VERSION\"', t, count=1)
          open(p,'w',encoding='utf-8').write(t)
          "
          # Refresh Cargo.lock so the workspace version matches
          (cd src-tauri && cargo update --workspace --offline 2>/dev/null || cargo update --workspace)

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BOOKSHELL ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="src-tauri/target/release/bookshell.exe"
          OUT="BOOKSHELL_${VERSION}_x64-portable.exe"
          cp "$SRC" "$OUT"
          gh release upload "${GITHUB_REF_NAME}" "$OUT" --clobber
